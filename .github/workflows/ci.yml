name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel superseded runs for the same ref so rapid pushes / PR updates
# (e.g. Dependabot bursts) do not pile up redundant runner-minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-quality

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint workspace
        run: cargo clippy --workspace --locked -- -D warnings

  test-shards:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: compiler-core
            command: bash scripts/ci-test-shard.sh core
          - name: integration-1
            command: bash scripts/ci-test-shard.sh integration 0 4
          - name: integration-2
            command: bash scripts/ci-test-shard.sh integration 1 4
          - name: integration-3
            command: bash scripts/ci-test-shard.sh integration 2 4
          - name: integration-4
            command: bash scripts/ci-test-shard.sh integration 3 4
          - name: warder
            command: bash scripts/ci-test-shard.sh warder
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-tests

      - name: Run test shard
        run: ${{ matrix.command }}

  release-gates:
    name: Release gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-release-gates

      - name: Check standalone release example entrypoints
        run: >-
          cargo test -p restrict_lang --locked
          --test quality_gates
          test_release_example_hygiene::standalone_release_examples_compile_through_cli
          -- --ignored --exact --test-threads=1

      - name: Check VS Code release example entrypoints
        run: >-
          cargo test -p restrict_lang --locked
          --test quality_gates
          test_release_example_hygiene::vscode_release_examples_compile_through_cli
          -- --ignored --exact --test-threads=1

      - name: Check generated playground samples
        run: bash scripts/sync_samples.sh --check

      - name: Smoke test checked-in web runtime
        run: node scripts/smoke-web-runtime.mjs

  benchmark-smoke:
    name: Core Wasm benchmark baseline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-benchmark-smoke

      - name: Build benchmark tools
        run: >-
          cargo build --locked --release
          --bin restrict_lang --bin restrict_bench --bin restrict_bench_compare

      - name: Record full Core Wasm benchmark report
        run: >-
          ./target/release/restrict_bench
          --output target/benchmark-results/restrict-baseline.json

      - name: Enforce deterministic benchmark baseline
        run: >-
          ./target/release/restrict_bench_compare
          --baseline benchmarks/baselines/core-wasm-v0.0.1.json
          --candidate target/benchmark-results/restrict-baseline.json
          --policy benchmarks/regression-policy.json

      - name: Upload raw benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: core-wasm-benchmark-${{ github.run_id }}
          path: target/benchmark-results/
          if-no-files-found: error
          retention-days: 14

  # Keep the historical `test` check name stable for branch protection while
  # the expensive work runs in parallel above.
  test:
    name: test
    if: always()
    needs: [quality, test-shards, release-gates, benchmark-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI partition
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_SHARDS_RESULT: ${{ needs.test-shards.result }}
          RELEASE_GATES_RESULT: ${{ needs.release-gates.result }}
          BENCHMARK_SMOKE_RESULT: ${{ needs.benchmark-smoke.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TEST_SHARDS_RESULT" = success
          test "$RELEASE_GATES_RESULT" = success
          test "$BENCHMARK_SMOKE_RESULT" = success

  build-release:
    name: Release build smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-release-build

      - name: Build workspace release binaries
        run: cargo build --workspace --locked --release
