name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version label used for dry-run artifact names
        required: true
        default: v0.0.1

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - id: version
        name: Match workflow version to Cargo metadata
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          set -euo pipefail
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          requested_version="${REQUESTED_VERSION#v}"
          test "$requested_version" = "$cargo_version"
          echo "version=$requested_version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: darwin-x86_64
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-aarch64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Build workspace binaries
        run: cargo build --workspace --locked --release --target ${{ matrix.target }}

      - name: Package Unix binaries
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          package_dir="restrict-lang-v${{ needs.validate.outputs.version }}-${{ matrix.platform }}"
          mkdir -p "$package_dir"
          cp "target/${{ matrix.target }}/release/restrict_lang" "$package_dir/"
          cp "target/${{ matrix.target }}/release/warder" "$package_dir/"
          cp README.md LICENSE "$package_dir/"
          tar -czf "$package_dir.tar.gz" "$package_dir"

      - name: Package Windows binaries
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $packageDir = "restrict-lang-v${{ needs.validate.outputs.version }}-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path $packageDir
          Copy-Item "target/${{ matrix.target }}/release/restrict_lang.exe" $packageDir
          Copy-Item "target/${{ matrix.target }}/release/warder.exe" $packageDir
          Copy-Item README.md, LICENSE $packageDir
          Compress-Archive -Path $packageDir -DestinationPath "$packageDir.zip"

      - name: Upload packaged binaries
        uses: actions/upload-artifact@v4
        with:
          name: restrict-lang-${{ matrix.platform }}
          path: restrict-lang-v${{ needs.validate.outputs.version }}-${{ matrix.platform }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v5
        with:
          pattern: restrict-lang-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum restrict-lang-* > SHA256SUMS

      - name: Create release after every artifact succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes_file="docs/releases/${{ github.ref_name }}.md"
          if [ -f "$notes_file" ]; then
            gh release create "${{ github.ref_name }}" dist/* \
              --notes-file "$notes_file" \
              --title "Restrict Language ${{ github.ref_name }}"
          else
            gh release create "${{ github.ref_name }}" dist/* \
              --generate-notes \
              --title "Restrict Language ${{ github.ref_name }}"
          fi
