name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel superseded runs for the same ref so rapid pushes / PR updates
# (e.g. Dependabot bursts) do not pile up redundant runner-minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-quality

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint workspace
        run: cargo clippy --workspace --locked -- -D warnings

  test-shards:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: compiler-core
            command: bash scripts/ci-test-shard.sh core
          - name: integration-1
            command: bash scripts/ci-test-shard.sh integration 0 4
          - name: integration-2
            command: bash scripts/ci-test-shard.sh integration 1 4
          - name: integration-3
            command: bash scripts/ci-test-shard.sh integration 2 4
          - name: integration-4
            command: bash scripts/ci-test-shard.sh integration 3 4
          - name: warder
            command: bash scripts/ci-test-shard.sh warder
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-tests

      - name: Run test shard
        run: ${{ matrix.command }}

  release-gates:
    name: Release gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-release-gates

      - name: Check standalone release example entrypoints
        run: >-
          cargo test -p restrict_lang --locked
          --test test_release_example_hygiene
          standalone_release_examples_compile_through_cli
          -- --ignored --exact

      - name: Check VS Code release example entrypoints
        run: >-
          cargo test -p restrict_lang --locked
          --test test_release_example_hygiene
          vscode_release_examples_compile_through_cli
          -- --ignored --exact

      - name: Smoke test checked-in web runtime
        run: node scripts/smoke-web-runtime.mjs

  # Keep the historical `test` check name stable for branch protection while
  # the expensive work runs in parallel above.
  test:
    name: test
    if: always()
    needs: [quality, test-shards, release-gates]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI partition
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_SHARDS_RESULT: ${{ needs.test-shards.result }}
          RELEASE_GATES_RESULT: ${{ needs.release-gates.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TEST_SHARDS_RESULT" = success
          test "$RELEASE_GATES_RESULT" = success

  build-release:
    name: Release build smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-release-build

      - name: Build workspace release binaries
        run: cargo build --workspace --locked --release
