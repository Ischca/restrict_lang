name: Core Wasm benchmark evidence

on:
  schedule:
    - cron: '17 3 * * 1'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-wasm-benchmark-evidence
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Pinned Ubuntu timing evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1

      - name: Cache Cargo build products
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-wasm-benchmark-evidence

      - name: Build pinned benchmark tools
        run: >-
          cargo build --locked --release
          --bin restrict_lang --bin restrict_bench --bin restrict_bench_compare
          --bin restrict_bench_stability

      - name: Record and assess five full benchmark reports
        run: >-
          bash scripts/record-benchmark-evidence.sh
          target/benchmark-results/evidence
          5
          benchmarks/stability-policy.json

      - name: Write timing summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Core Wasm timing evidence'
            echo
            echo 'Timing remains informational until a reviewed runner report is promoted to a controlled baseline.'
            echo
            jq -r '"Within-run thresholds passed: **\(.thresholdsPassed)** (policy: \(.policyStatus), runner class: \(.runnerClass))"' \
              target/benchmark-results/evidence/stability-summary.json
            echo
            echo '| run | workload | median ns | release bytes | peak bytes | CPU |'
            echo '| ---: | --- | ---: | ---: | ---: | --- |'
            for report in target/benchmark-results/evidence/run-*.json; do
              run="$(basename "$report" .json)"
              jq -r --arg run "$run" \
                '.host.cpu as $cpu | .workloads[] | "| \($run) | \(.id) | \(.execution.medianNs) | \(.optimizedArtifact.wasmBytes) | \(.memory.peakBytes) | \($cpu) |"' \
                "$report"
            done
            echo
            echo '| workload | execution MAD % | compile MAD % | runtime compile MAD % | instantiation MAD % |'
            echo '| --- | ---: | ---: | ---: | ---: |'
            jq -r '.workloads[] | "| \(.id) | \(.executionMedian.relativeMadPercent) | \(.optimizedCompile.relativeMadPercent) | \(.runtimeCompile.relativeMadPercent) | \(.coldInstantiation.relativeMadPercent) |"' \
              target/benchmark-results/evidence/stability-summary.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw reports and Wasm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-wasm-evidence-${{ github.ref_name }}-${{ github.run_id }}
          path: target/benchmark-results/
          if-no-files-found: error
          retention-days: 90

  dedicated-candidate:
    name: Dedicated runner qualification evidence
    if: vars.RESTRICT_CONTROLLED_BENCHMARK_ENABLED == 'true'
    runs-on: [self-hosted, restrict-benchmark]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1

      - name: Cache Cargo build products
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: dedicated-core-wasm-benchmark-candidate

      - name: Build pinned benchmark tools
        run: >-
          cargo build --locked --release
          --bin restrict_lang --bin restrict_bench --bin restrict_bench_compare
          --bin restrict_bench_stability

      - name: Record dedicated-runner qualification evidence
        run: >-
          bash scripts/record-benchmark-evidence.sh
          target/benchmark-results/dedicated-candidate
          5
          benchmarks/stability-policy.dedicated-candidate.json

      - name: Write qualification summary
        run: |
          jq -r '
            "## Dedicated runner qualification evidence\n\n" +
            "CPU: \(.host.cpu)\n\n" +
            "Within-run thresholds passed: **\(.thresholdsPassed)**\n\n" +
            "Policy status: \(.policyStatus); promotion eligible: \(.promotionEligible)"
          ' target/benchmark-results/dedicated-candidate/stability-summary.json \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dedicated-runner qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: dedicated-core-wasm-candidate-${{ github.ref_name }}-${{ github.run_id }}
          path: target/benchmark-results/dedicated-candidate/
          if-no-files-found: error
          retention-days: 90
